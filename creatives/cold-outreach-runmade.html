<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Runmade — Cold Outreach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 60px 24px;
    background: #E8E3D6;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: #141414;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 600px;
    margin: 0 auto;
    background: #F3EFE6;
    padding: 56px 52px 48px;
    border: 2px solid #141414;
    box-shadow: 10px 10px 0 #141414;
    position: relative;
    overflow: hidden;
  }

  /* Riso splash behind headline */
  .blob {
    position: absolute;
    top: -60px;
    right: -60px;
    width: 240px;
    height: 240px;
    background: #FF4D2E;
    border-radius: 50%;
    mix-blend-mode: multiply;
    opacity: 0.92;
    z-index: 0;
  }
  .blob.blue {
    top: auto;
    bottom: -90px;
    left: -80px;
    right: auto;
    width: 200px;
    height: 200px;
    background: #1B49C2;
    opacity: 0.85;
  }

  .content { position: relative; z-index: 1; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #141414;
    margin: 0 0 56px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #141414;
    border-radius: 50%;
  }

  h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 40px 0;
  }
  h1 em {
    font-style: italic;
    color: #1B49C2;
  }
  h1 .big {
    display: block;
    font-size: 96px;
    line-height: 0.95;
    color: #141414;
    margin-bottom: 4px;
  }

  .sub {
    font-size: 17px;
    line-height: 1.5;
    margin: 0 0 44px 0;
    max-width: 420px;
    color: #1f1f1f;
  }
  .sub strong {
    background: #FFE9B0;
    padding: 1px 4px;
    font-weight: 600;
  }

  .cta {
    display: inline-block;
    background: #141414;
    color: #F3EFE6 !important;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 16px 26px;
    border: 2px solid #141414;
    box-shadow: 5px 5px 0 #FF4D2E;
  }

  .foot {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 2px solid #141414;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #141414;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .foot .brand { font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="blob"></div>
    <div class="blob blue"></div>

    <div class="content">
      <p class="eyebrow">Runmade × {{company}}</p>

      <h1>
        <span class="big">5 min.</span>
        to <em>unlock</em> revenue<br/>
        already in your inbox.
      </h1>

      <p class="sub">
        <strong>Your existing clients need software.</strong>
        We build it under your brand. You keep the relationship — and a share.
      </p>

      <a href="https://cal.com/runmade/intro" class="cta">Book 15 min →</a>

      <div class="foot">
        <span class="brand">RUNMADE</span>
        <span>runmade.com</span>
      </div>
    </div>
  </div>
</body>
</html>
